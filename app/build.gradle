plugins {
    id 'com.android.application'
}

def appVerCode = Integer.parseInt((project.findProperty('verCode') ?: '1').toString())
def appVerName = (project.findProperty('verName') ?: '1.0.0').toString()

android {
    namespace 'com.frantv.premium'
    compileSdk 34

    defaultConfig {
        applicationId 'com.frantv.premium'
        minSdk 21
        targetSdk 34
        versionCode appVerCode
        versionName appVerName
    }

    signingConfigs {
        release {
            storeFile file('../signing/franclaudetv.jks')
            storePassword 'frantv2026'
            keyAlias 'frantv'
            keyPassword 'frantv2026'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
